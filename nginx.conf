worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Match the local Supabase Storage file size limit (supabase/config.toml).
    client_max_body_size 50m;

    # Preserve WebSocket upgrades to the Next.js dev server.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The Next.js app runs as a host process (bun run dev) on port 3000.
    upstream nextjs {
        server host.docker.internal:3000;
    }

    # Any hostname other than the two below is not part of the application.
    server {
        listen 80 default_server;
        server_name _;

        return 404;
    }

    # app.localhost -> read-only API reference.
    server {
        listen 80;
        server_name app.localhost;

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # resource.localhost -> public resource page.
    server {
        listen 80;
        server_name resource.localhost;

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
